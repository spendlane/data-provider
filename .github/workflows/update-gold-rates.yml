name: Update gold and FX rates

on:
  schedule:
    # Every 6 hours at minute 17 (UTC): ~124 MetalCharts calls a month, inside the 200 free limit.
    # An off-peak minute avoids GitHub's busy top-of-hour queue.
    - cron: "17 */6 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

permissions:
  contents: write   # commit the updated data files (keeps a history in the repo)
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: gold-rates
  cancel-in-progress: false

jobs:
  update:
    # Pinned so the Ubuntu 26 migration of ubuntu-latest doesn't change the runner unexpectedly.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          # The branch tip, not the commit the run was created on. A re-run of an old run otherwise
          # rebuilds the feeds from stale data files and its push conflicts with newer data on main.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Each feed runs on its own. A failed script leaves its file at the last good values,
      # the other feed still publishes, and the job is marked failed at the end so you notice.
      - name: Exchange rates (fx.json)
        id: fx
        continue-on-error: true
        run: python scripts/fetch_fx.py

      - name: Gold rates (rates.json)
        id: gold
        continue-on-error: true
        env:
          METALCHARTS_KEY: ${{ secrets.METALCHARTS_KEY }}
        run: python scripts/fetch_rates.py

      - name: Commit updated rates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ doesn't exist until a feed succeeds at least once, and `git add` fails on a missing path.
          if [ -d data ]; then
            git add -A data
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update rates $(date -u +'%Y-%m-%d %H:%M') UTC"
            # Pick up any commit pushed to main while this job was running. The data files are
            # generated, so on a clash keep this run's freshly built ones (in a rebase, "theirs"
            # is the commit being replayed, i.e. ours).
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare Pages site
        run: |
          mkdir -p _site data
          cp -r data _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report failed feeds
        # always() so a failed feed is still reported when a later step (commit or deploy) also failed.
        if: always() && (steps.fx.outcome == 'failure' || steps.gold.outcome == 'failure')
        run: |
          echo "FX: ${{ steps.fx.outcome }} | Gold: ${{ steps.gold.outcome }}"
          echo "A failed feed kept its last good file. Check the step logs above."
          exit 1
